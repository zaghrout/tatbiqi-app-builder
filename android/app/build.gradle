apply plugin: 'com.android.application'

android {
    namespace 'com.tatbiqi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tatbiqi.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ===== SIGNING CONFIG (debug keystore - generated by workflow) =====
    signingConfigs {
        debug {
            // Try multiple keystore locations (workflow copies it to project dir as backup)
            def keystoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            def projectKeystore = file("debug.keystore")
            
            if (projectKeystore.exists()) {
                storeFile projectKeystore
            } else if (keystoreFile.exists()) {
                storeFile keystoreFile
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // For now, use debug signing for release too (will be replaced with real keystore later)
            def keystoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            def projectKeystore = file("debug.keystore")
            
            if (projectKeystore.exists()) {
                storeFile projectKeystore
            } else if (keystoreFile.exists()) {
                storeFile keystoreFile
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }

    // Lint options to prevent build failures on warnings
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    
    // Capacitor core
    implementation 'com.capacitorjs:core:6.1.2'
    implementation 'com.capacitorjs:android:6.1.2'
    
    // Appcompat and material design
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    
    // Splash screen
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    // Test dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Apply capacitor settings
apply from: "capacitor.settings.gradle"
