apply plugin: 'com.android.application'

android {
    namespace 'com.tatbiqi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tatbiqi.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // Prevent testOnly flag - allows installation on all devices (Realme/Xiaomi/Oppo)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Force testOnly=false even in debug builds
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            // Strip testOnly=true flag
            outputFileName = outputFileName.replace("-debug", "").replace("-release", "")
        }
    }

    signingConfigs {
        debug {
            def stableKeystore = file("tatbiqi-debug.keystore")
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword 'tatbiqi123'
                keyAlias 'tatbiqi-debug'
                keyPassword 'tatbiqi123'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            } else {
                def fallback = file("${System.getProperty('user.home')}/.android/debug.keystore")
                if (fallback.exists()) {
                    storeFile fallback
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
        release {
            def stableKeystore = file("tatbiqi-debug.keystore")
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword 'tatbiqi123'
                keyAlias 'tatbiqi-debug'
                keyPassword 'tatbiqi123'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            } else {
                def fallback = file("${System.getProperty('user.home')}/.android/debug.keystore")
                if (fallback.exists()) {
                    storeFile fallback
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
            // Critical: this prevents testOnly flag that blocks install on Realme/Xiaomi/Oppo
            // Without this, Android marks the APK as testOnly and refuses to install
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // ===== CRITICAL FIXES for Realme/Xiaomi install issues =====
    
    // 1. Disable baseline profiles (causes install fail on some devices)
    bundle {
        // Don't split by ABI - ship one universal APK
        abi {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        language {
            enableSplit = false
        }
    }
    
    // 2. Disable profileinstaller (writes dexopt/baseline.prof which breaks install)
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.version',
                'META-INF/androidx.*.version',
                'DebugProbesKt.bin'
            ]
            // Pick first when there are duplicates (baseline.prof comes from androidx.profileinstaller)
            pickFirsts += [
                'assets/dexopt/baseline.prof',
                'assets/dexopt/baseline.profm'
            ]
        }
    }
    
    // Disable profile installer compilation (creates the problematic baseline.prof)
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.packaging.resources.excludes.add('assets/dexopt/baseline.prof')
            variant.packaging.resources.excludes.add('assets/dexopt/baseline.profm')
        }
    }
    
    // 3. Force extractNativeLibs=true in manifest (Realme requires this)
    // We need to inject this via a manifest placeholder

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    
    // MINIMAL dependencies for testing - no Capacitor, no Material, no appcompat
    implementation 'androidx.webkit:webkit:1.10.0'
    
    // Explicitly exclude profileinstaller from everything
    configurations.all {
        exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
        exclude group: 'androidx.appcompat', module: 'appcompat'
    }
}






