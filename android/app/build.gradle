apply plugin: 'com.android.application'

android {
    namespace 'com.tatbiqi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tatbiqi.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            def keystoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            def projectKeystore = file("debug.keystore")
            if (projectKeystore.exists()) {
                storeFile projectKeystore
            } else if (keystoreFile.exists()) {
                storeFile keystoreFile
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            def projectKeystore = file("debug.keystore")
            if (projectKeystore.exists()) {
                storeFile projectKeystore
            } else if (keystoreFile.exists()) {
                storeFile keystoreFile
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // Capacitor Android - included as local module via settings.gradle
    implementation project(':capacitor-android')

    // AndroidX + Material
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

apply from: "capacitor.settings.gradle"
