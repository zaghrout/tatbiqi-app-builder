apply plugin: 'com.android.application'

android {
    namespace 'com.tatbiqi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tatbiqi.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // ===== STABLE SIGNING (uses committed keystore - same key for ALL builds) =====
    signingConfigs {
        debug {
            // Use the stable keystore committed to the repo
            def stableKeystore = file("tatbiqi-debug.keystore")
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword 'tatbiqi123'
                keyAlias 'tatbiqi-debug'
                keyPassword 'tatbiqi123'
            } else {
                // Fallback to runner's default debug keystore
                def fallback = file("${System.getProperty('user.home')}/.android/debug.keystore")
                if (fallback.exists()) {
                    storeFile fallback
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
        release {
            def stableKeystore = file("tatbiqi-debug.keystore")
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword 'tatbiqi123'
                keyAlias 'tatbiqi-debug'
                keyPassword 'tatbiqi123'
            } else {
                def fallback = file("${System.getProperty('user.home')}/.android/debug.keystore")
                if (fallback.exists()) {
                    storeFile fallback
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            // Enable all signature schemes for max compatibility
            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled true
            v4SigningEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled true
            v4SigningEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}

apply from: "capacitor.settings.gradle"
