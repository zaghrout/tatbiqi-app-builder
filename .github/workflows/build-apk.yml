name: Build Android APK
run-name: "Build ${{ github.event.client_payload.order_number || inputs.order_number }}"

# Triggered by the dashboard (repository_dispatch) or by hand for testing.
# Builds with aapt2 + d8 + apksigner (no Gradle), uploads the APK to R2,
# then reports back to the dashboard with a signed callback.
#
# Repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   BUILD_CALLBACK_SECRET   (same value as on Vercel)
# Repository variable (optional):
#   TATBIQI_CALLBACK_URL    default https://app.tatbiqii.com/api/build/callback

on:
  repository_dispatch:
    types: [build-app]
  workflow_dispatch:
    inputs:
      store_url:
        description: Store URL (https)
        required: true
        default: https://salla.sa
      app_name:
        description: App name
        required: true
        default: متجري
      package_name:
        description: Package name
        required: true
        default: sa.tatbiqi.test
      primary_color:
        description: Color hex without #
        default: 0F766E
      logo_url:
        description: Logo URL (optional)
        default: ''
      whatsapp_number:
        description: WhatsApp with country code (optional)
        default: ''
      order_number:
        description: Order number
        required: true
        default: TEST-001
      version_code:
        description: Version code
        default: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORE_URL: ${{ github.event.client_payload.store_url || inputs.store_url }}
      APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name }}
      PACKAGE_NAME: ${{ github.event.client_payload.package_name || inputs.package_name }}
      PRIMARY_COLOR: ${{ github.event.client_payload.primary_color || inputs.primary_color || '0F766E' }}
      LOGO_URL: ${{ github.event.client_payload.logo_url || inputs.logo_url }}
      WHATSAPP: ${{ github.event.client_payload.whatsapp_number || inputs.whatsapp_number }}
      WHATSAPP_MESSAGE: ${{ github.event.client_payload.whatsapp_message }}
      ORDER_NUMBER: ${{ github.event.client_payload.order_number || inputs.order_number }}
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      VERSION_CODE: ${{ github.event.client_payload.version_code || inputs.version_code || '1' }}
      VERSION_NAME: ${{ github.event.client_payload.version_name || '1.0.0' }}
      CALLBACK_URL: ${{ vars.TATBIQI_CALLBACK_URL || 'https://app.tatbiqii.com/api/build/callback' }}
      BUILD_CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [[ "$ORDER_NUMBER" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "bad order number"; exit 1; }
          [[ -z "$BUILD_ID" || "$BUILD_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "bad build id"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]{1,10}$ ]] || { echo "bad version code"; exit 1; }

      - name: Report building
        run: python3 builder/callback.py --status building || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 34 + build-tools 34)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$ANDROID_HOME/build-tools/34.0.0/aapt2" "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Python deps
        run: python3 -m pip install --quiet pillow

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 builder/build_apk.py \
            --store-url "$STORE_URL" \
            --app-name "$APP_NAME" \
            --package-name "$PACKAGE_NAME" \
            --primary-color "$PRIMARY_COLOR" \
            --logo-url "$LOGO_URL" \
            --whatsapp "$WHATSAPP" \
            --whatsapp-message "$WHATSAPP_MESSAGE" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --output "out/app.apk" \
            --result-json "out/result.json"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          KEY="apks/${ORDER_NUMBER}/${VERSION_CODE}.apk"
          aws s3 cp out/app.apk "s3://${R2_BUCKET}/${KEY}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/vnd.android.package-archive \
            --no-progress
          echo "APK_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Keep APK as artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.ORDER_NUMBER }}
          path: out/app.apk
          retention-days: 7

      - name: Report ready
        run: python3 builder/callback.py --status ready --result-json out/result.json --apk-key "$APK_KEY"

      - name: Report failure
        if: failure()
        run: python3 builder/callback.py --status failed --error "Build failed. See $RUN_URL" || true

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
