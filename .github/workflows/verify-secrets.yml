name: Verify secrets (temporary)
on:
  push:
    branches: [verify-secrets]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check keystore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ok=1
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is MISSING"; ok=0; else echo "::notice::$v present (${#v} name, length ${#KEYSTORE_BASE64})"; fi
          done
          [ $ok = 1 ] || exit 1
          echo "$KEYSTORE_BASE64" | base64 -d > ks.p12 2>/dev/null || { echo "::error::KEYSTORE_BASE64 is not valid base64"; exit 1; }
          if keytool -list -keystore ks.p12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            FP=$(keytool -list -v -keystore ks.p12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -m1 'SHA1:' | sed 's/.*SHA1: //')
            echo "::notice::KEYSTORE OK - alias found, password correct, SHA1 $FP"
          else
            echo "::error::Keystore could not be opened with KEYSTORE_PASSWORD / KEY_ALIAS"; exit 1
          fi
          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then echo "::warning::KEY_PASSWORD differs from KEYSTORE_PASSWORD"; fi
          rm -f ks.p12
