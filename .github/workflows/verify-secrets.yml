name: Verify secrets (temporary)
on:
  push:
    branches: [verify-secrets]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check callback secret
        env:
          BUILD_CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
        run: |
          [ -n "$BUILD_CALLBACK_SECRET" ] || { echo "::error::BUILD_CALLBACK_SECRET is MISSING"; exit 1; }
          echo "::notice::CALLBACK SECRET present, length ${#BUILD_CALLBACK_SECRET}, sha256 prefix $(printf %s "$BUILD_CALLBACK_SECRET" | sha256sum | cut -c1-8)"
      - name: Check keystore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ok=1
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is MISSING"; ok=0; else echo "::notice::$v present (${#v} name, length ${#KEYSTORE_BASE64})"; fi
          done
          [ $ok = 1 ] || exit 1
          echo "$KEYSTORE_BASE64" | base64 -d > ks.p12 2>/dev/null || { echo "::error::KEYSTORE_BASE64 is not valid base64"; exit 1; }
          if keytool -list -keystore ks.p12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            FP=$(keytool -list -v -keystore ks.p12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -m1 'SHA1:' | sed 's/.*SHA1: //')
            echo "::notice::KEYSTORE OK - alias found, password correct, SHA1 $FP"
          else
            echo "::error::Keystore could not be opened with KEYSTORE_PASSWORD / KEY_ALIAS"; exit 1
          fi
          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then echo "::warning::KEY_PASSWORD differs from KEYSTORE_PASSWORD"; fi
          rm -f ks.p12
      - name: Check R2 upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for v in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is MISSING"; exit 1; }
          done
          echo "::notice::R2 secrets present (account id length ${#R2_ACCOUNT_ID}, bucket length ${#R2_BUCKET})"
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "tatbiqi r2 check $(date -u)" > check.txt
          if aws s3 cp check.txt "s3://${R2_BUCKET}/apks/_check/check.txt" --endpoint-url "$EP" --no-progress > out.log 2>&1; then
            echo "::notice::R2 UPLOAD OK"
          else
            echo "::error::R2 upload failed: $(tr '\n' ' ' < out.log | cut -c1-300)"; exit 1
          fi
          aws s3 rm "s3://${R2_BUCKET}/apks/_check/check.txt" --endpoint-url "$EP" > /dev/null 2>&1 && echo "::notice::R2 DELETE OK" || echo "::warning::could not delete test file"
      - uses: actions/checkout@v4
        with:
          ref: verify-secrets
          path: repo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Test APK build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 -m pip install --quiet pillow
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/k.p12"
          export KEYSTORE_PATH="$RUNNER_TEMP/k.p12"
          cd repo
          python3 builder/build_apk.py --store-url https://salla.sa --app-name "متجر تجريبي" \
            --package-name sa.tatbiqi.test_check --primary-color C0392B --whatsapp 966555555555 \
            --logo-url https://github.githubassets.com/favicons/favicon.png \
            --version-code 2 --output out/test.apk --result-json out/r.json > build.log 2>&1 || { echo "::error::BUILD FAILED: $(grep -E 'error|❌|failed' build.log | tail -5 | tr '\n' ' ' | cut -c1-600)"; exit 1; }
          echo "::notice::BUILD OK $(cat out/r.json)"
          BT=$ANDROID_HOME/build-tools/34.0.0
          echo "::notice::BADGING $($BT/aapt2 dump badging out/test.apk | grep -E '^package|^application-label:|launchable' | tr '\n' ' ' | cut -c1-400)"
          echo "::notice::SIGNERS $($BT/apksigner verify --print-certs -v out/test.apk | grep -E 'Verified using|SHA-1' | tr '\n' ' ' | cut -c1-400)"
          rm -f "$RUNNER_TEMP/k.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: repo/out/test.apk
          retention-days: 3
